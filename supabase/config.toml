# PfotenNetz Supabase Configuration (CLI v2.x format)
# Reference: https://supabase.com/docs/guides/local-development/cli/config
# Regenerated 2026-09-22: old template used removed keys
# ([edge_functions], [functions] verify_jwt, [logs], [auth.experimental],
#  [auth.email] secure_email_change, [realtime] port) which CLI >= 2.x
# rejects with CliConfigParseError.

project_id = "pfotennetz-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match remote: SHOW server_version → 17.6 (project njkyujhbcolvtcnlahsk)
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# No seed files exist (supabase/seed/ is empty); keep disabled so a future
# `supabase start` / `db reset` does not look for ./seed.sql.
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[storage]
enabled = true
file_size_limit = "50MiB"
# Buckets are configured via migrations (014_storage_buckets.sql), not here.

[storage.s3_protocol]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:8081",
  "exp://localhost:8081",
  "pfotennetz://auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Passkeys are enabled on the hosted project via Dashboard → Auth → MFA.
# Locally the new CLI key would be [auth.passkey] + [auth.webauthn];
# left at defaults here (no local passkey testing configured).

# OAuth placeholders – fill in via Dashboard (hosted) or env for local.
[auth.external.google]
enabled = false
client_id = "your-google-client-id"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.external.facebook]
enabled = false
client_id = "your-facebook-app-id"
secret = "env(SUPABASE_AUTH_EXTERNAL_FACEBOOK_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"
