# Supabase-Konfiguration für PfotenNetz
#
# Diese Datei steuert die lokale Supabase-Entwicklungsumgebung (Docker) und
# liefert der CLI die Projekt-ID für `supabase link` / `supabase db push`.
#
# Referenz: https://supabase.com/docs/guides/local-development/cli/config
#
# Typischer Ablauf:
#   npx supabase start          # lokale DB + Studio starten
#   npx supabase db reset       # Migrationen lokal neu einspielen
#   npx supabase link           # mit dem Cloud-Projekt verbinden
#   npx supabase db push        # Migrationen in die Cloud übertragen

project_id = "pfotennetz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Für die lokale Entwicklung: Expo-Web läuft typischerweise auf Port 8081/8082.
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081", "http://localhost:8082"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
# Lokal ohne E-Mail-Versand: Bestätigung aus, damit man sich direkt anmelden kann.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[analytics]
enabled = false
