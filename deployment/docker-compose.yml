services:
  web:
    image: node:22-alpine
    container_name: pfotennetz-web
    restart: unless-stopped
    working_dir: /app
    command: node apps/web/server.js
    volumes:
      - ./next-standalone:/app:ro
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true
    name: caddy_proxy
