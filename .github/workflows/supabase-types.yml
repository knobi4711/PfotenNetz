name: Supabase type drift

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  configuration:
    name: Check remote schema configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.configuration.outputs.configured }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Determine configuration
        id: configuration
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_REF" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped scheduled check
        if: ${{ github.event_name == 'schedule' && steps.configuration.outputs.configured == 'false' }}
        run: |
          echo "::notice::Supabase type drift check skipped: configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF to enable scheduled checks."

  check:
    name: Check generated database types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: configuration
    if: ${{ github.event_name == 'workflow_dispatch' || needs.configuration.outputs.configured == 'true' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Require remote schema configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in repository secrets."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate types from the remote project
        shell: bash
        run: |
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_REF" --schema public > "$RUNNER_TEMP/database.ts"
          test -s "$RUNNER_TEMP/database.ts"

      - name: Fail when checked-in types drift
        shell: bash
        run: |
          pnpm exec prettier --stdin-filepath packages/supabase/src/types/database.ts < "$RUNNER_TEMP/database.ts" > "$RUNNER_TEMP/database.remote.ts"
          pnpm exec prettier --stdin-filepath packages/supabase/src/types/database.ts < packages/supabase/src/types/database.ts > "$RUNNER_TEMP/database.checked-in.ts"
          diff -u "$RUNNER_TEMP/database.checked-in.ts" "$RUNNER_TEMP/database.remote.ts"
